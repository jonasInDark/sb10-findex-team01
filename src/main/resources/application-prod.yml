spring:
  datasource:
    url: ${DB_URL}?reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

logging:
  level:
    root: info
    org.hibernate.SQL: error
    org.hibernate.orm.jdbc.bind: error
    org.springframework.web: info
