name: Findex

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: findex
          DB_USERNAME: findex
          DB_PASSWORD: password
          OPENAPI_URI: https://example.com
          OPENAPI_KEY: FINDEX
          APP_PORT: 8080
        run: ./gradlew bootJar -x test
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        run: docker build --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/findex-app:latest . &&
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/findex-app:latest
